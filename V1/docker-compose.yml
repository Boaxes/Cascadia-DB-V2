# Local development stack. Everything the project needs to run is in here, so
# a new machine needs Docker and nothing else -- no Postgres, no PostGIS, no
# GDAL/GEOS, no Microsoft ODBC driver installed by hand.
#
#     cp .env.example .env      # once
#     docker compose up         # database + web application
#
# The import is a one-shot, so it sits behind a profile and is run on demand:
#
#     docker compose run --rm etl python import_raw.py

name: cascadia

services:
  # -------------------------------------------------------------------------
  # Postgres 18 + PostGIS 3.6, matching the managed cluster this replaces
  # (PostgreSQL 18.6, PostGIS 3.6.4).
  #
  # imresamu/postgis rather than the postgis/postgis image the PostGIS project
  # publishes: postgis/postgis has no arm64 build, so on an Apple Silicon Mac
  # it runs emulated. This one is the same Dockerfile built for both
  # architectures, and is the multi-architecture build the PostGIS project
  # itself points at.
  # -------------------------------------------------------------------------
  db:
    image: imresamu/postgis:18-3.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cascadia}
      POSTGRES_USER: ${POSTGRES_USER:-cascadia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cascadia}
    ports:
      # 5433 on the host, so a Postgres already installed locally on 5432 is
      # left alone. This is the port pgAdmin and psql connect to.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cascadia} -d ${POSTGRES_DB:-cascadia}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # -------------------------------------------------------------------------
  # The Django application. The image carries GDAL and GEOS, which GeoDjango
  # loads at import time.
  # -------------------------------------------------------------------------
  web:
    build: ./Django
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    volumes:
      # The source is mounted, so an edit on the host reloads the server.
      - ./Django:/app
      # The tests that need the live data's copy. PYTHONPATH makes them importable.
      - ./TESTS:/TESTS
    environment:
      PYTHONPATH: /
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  # -------------------------------------------------------------------------
  # The import of every DB167 table into raw. Separate image because it is the
  # only thing that needs the Microsoft ODBC driver, and only it talks to DB167.
  # -------------------------------------------------------------------------
  etl:
    build: ./ETL
    profiles: ["etl"]
    env_file: .env
    volumes:
      - ./ETL:/app
    depends_on:
      db:
        condition: service_healthy

  # -------------------------------------------------------------------------
  # A local SQL Server holding copies of DB167 to test against: DB167_Today
  # (DB167 as it is now) and DB167_LastImport (as it was at the live site's
  # last import, rebuilt from its raw schema). Built by ETL/mirror_sqlserver.py.
  # The same version as DB167 (2022 CU27). Microsoft publishes it for Intel
  # only, so on an Apple Silicon Mac Docker runs it through Rosetta.
  #
  #     docker compose --profile mssql up -d mssql
  # -------------------------------------------------------------------------
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-CU27-GDR1-ubuntu-22.04
    platform: linux/amd64
    profiles: ["mssql"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
      MSSQL_COLLATION: SQL_Latin1_General_CP1_CI_AS
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'select 1' -b -o /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

volumes:
  pgdata:
  mssqldata:
