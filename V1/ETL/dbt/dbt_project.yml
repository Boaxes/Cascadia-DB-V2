# The data pipeline: raw -> dbo -> app. The Data Pipeline page in Cascadia
# Admin (Django/datahealth/pipeline.py) explains each step.
#
#     dbt deps                           # once, for Elementary
#     dbt build                          # into build_next, dbo_next and app_next
#     dbt run-operation swap             # move them into place
#
# raw is DB167 as imported (ETL/import_raw.py). app.audit_log, app.track_geometry
# and app.vessel_number are written by the website or kept from build to build:
# dbt reads them and never drops them. Everything under models/ is rebuilt on
# every run, from those inputs and the files in seeds/.

name: cascadia
version: "2.0.0"
profile: cascadia

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

on-run-start:
  - "{{ persistent_tables() }}"
  - "{{ prepare_next_schemas() }}"

on-run-end:
  - "{{ finish_build(results) }}"
  - "{{ refresh_db167_state() }}"

flags:
  send_anonymous_usage_stats: false

vars:
  # Elementary keeps a few of the rows a failed test found, and its report is
  # published on the web, so it keeps none.
  test_sample_row_count: 0

seeds:
  cascadia:
    +schema: build
    +quote_columns: true
    column_kinds:
      +column_types: {table_name: text, column_name: text, kind: text, vocabulary: text}
    typos:
      +column_types: {table_name: text, column_name: text, wrong: text, correct: text}
    synonyms:
      +column_types: {table_name: text, column_name: text, synonym_set: integer, spelling: text}
    sub_areas:
      +column_types: {"ID": integer, "Sub-Area Database Entries": text, "Corrected Sub-Area": text, "Count": integer}
    species_added:
      +column_types: {species_id: integer, code: text, common_name: text, scientific_name: text}
    species_matches:
      +column_types: {spelling: text, code: text}
    species_categories:
      +column_types: {code: text, category: text}
    event_code_names:
      +column_types: {code: text, name: text}
    multi_track_efforts:
      +column_types: {effort: integer, tracks: integer}
    record_fixes:
      +column_types: {table_name: text, legacy_id: text, record_date: text, column_name: text, old_value: text, new_value: text, rule: text, reason: text}
    removed_efforts:
      +column_types: {removed_effort: integer, kept_effort: integer, reason: text}

models:
  cascadia:
    # Postgres's just-in-time compiler costs more than it saves on these
    # one-off queries.
    +pre-hook: "set local jit = off"
    build:
      +schema: build
      +materialized: table
    dbo:
      +schema: dbo
      +materialized: table
      # Primary Keys, NOT NULL, indexes and triggers, from each model's YAML.
      +post-hook: "{{ apply_structure() }}"
      views:
        +materialized: view
        +post-hook: []
    app:
      +schema: app
      +materialized: updatable_view
  # Elementary records every run's results and test outcomes for its report.
  # Its own models are built once into the elementary schema:
  #     dbt run --select elementary
  elementary:
    +schema: elementary
