# What dbt reads and never drops.

sources:
  - name: raw
    description: "DB167, copied table for table by ETL/import_raw.py. Never changed by the build."
    schema: raw
    quoting:
      identifier: true
    tables:
      - name: DailyConditionT
      - name: DailyEffortT
      - name: DailyEventT
      - name: EventCodeT
      - name: IdentificationT
      - name: IndividualT
      - name: OtherSpeciesT
      - name: ResearchGroupT
      - name: SampleT
      - name: SightingEventT
      - name: SightingT
      - name: SourceT
      - name: SpeciesT
      - name: TagSummaryT
      - name: TrackCompleteCodeT
      - name: TrackFileList
      - name: TrackT
      - name: VesselT

  - name: app
    description: "Tables the website writes, or the build keeps from one run to the next."
    schema: app
    tables:
      - name: audit_log
        description: "One row per change made on the website."
      - name: track_geometry
        description: "One row per GPS file in the bucket, with its line. Written by Django/datahealth/gps/tracks.py."
      - name: vessel_number
        description: "Each vessel's vessel_id, kept for good once given. The swap adds new vessels."
      - name: pipeline_run
        description: "One row per run of the daily pipeline workflow. Written by ETL/pipeline_run.py after the build, never by the build or the swap."
