# Each dbo table's structure, applied after it is built (macros/structure.sql):
# its Primary Key, the Legacy ID kept unique, indexes, the triggers that keep a
# position's map point in step with an edit, and the Foreign Keys, added once
# every table exists. The database then refuses any Foreign Key value that
# points at nothing.

version: 2
models:
- name: DailyConditionT
  config:
    meta:
      structure:
        primary_key:
        - id
        unique:
        - - DailyConditionID
        indexes:
        - name: ix_dailyconditiont_daily_effort_id
          columns:
          - daily_effort_id
        - name: ix_dailyconditiont_research_group_id
          columns:
          - research_group_id
        - name: ix_dailyconditiont_vessel_id
          columns:
          - vessel_id
        - name: ix_dailyconditiont_geom
          columns:
          - geom
          using: gist
        triggers:
        - name: dailyconditiont_geometry
          function: child_geometry
  columns:
  - name: id
    quote: true
    config:
      meta:
        not_null: true
  - name: daily_effort_id
    quote: true
    config:
      meta:
        references:
          table: DailyEffortT
          column: id
          name: fk_dailyconditiont_daily_effort_id
  - name: research_group_id
    quote: true
    config:
      meta:
        references:
          table: ResearchGroupT
          column: ResearchGroupID
          name: fk_dailyconditiont_research_group_id
  - name: vessel_id
    quote: true
    config:
      meta:
        references:
          table: VesselListT
          column: vessel_id
          name: fk_dailyconditiont_vessel_id
