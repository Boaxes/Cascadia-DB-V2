name: Tests

# Runs the tests on every push and every pull request, so working code stays
# working. The deploy (deploy.yml) calls this same workflow and waits for it,
# which is how a push to main is tested: that is why a push to main does not
# also start this workflow on its own (it would run twice).
#
# Two jobs, side by side:
#   unit      Django's unit tests, which need no database
#   database  everything that needs data. The data is a small, scrubbed piece
#             of the real records, committed in the repository
#             (ETL/ci/seed.sql.gz; how it was made and what was removed is
#             written at the top of ops/build-ci-seed.sh). The job:
#               1. loads it into a PostGIS database
#               2. builds dbo and app from it with dbt, running every dbt test,
#                  then builds again and compares every table (the build has
#                  to give the same result twice), then swaps the build in
#               3. checks the real GPS files in ETL/ci/track_files give the
#                  lines the seed stores, then runs the site tests in TESTS/
#                  against it
#               4. checks the website's edits are replayed correctly over three
#                  builds (ETL/verify/applied_entries_replay.sh)
#               5. checks edits made on the website survive a rebuild
#                  (ETL/verify/website_edits_survive.py)
#
# Each step is a command in ETL/ci/steps.sh. ops/ci-local.sh runs the same
# steps on a Mac in throwaway containers, to prove a change before pushing.
#
# What this does not cover (it needs things that only exist on the Mac or on
# the server): the live data and its `reference` copy, the local SQL Server
# copies of DB167, the real GPS file bucket, and the live site. The tests that
# need those are listed in ETL/ci/ci_runner.py with the reason, and are skipped
# with a message rather than failed.
#
# The seed's made-up users: ci_admin (superuser), ci_editor, ci_viewer. ci_admin's
# password is a throwaway that guards nothing, as the database it opens is thrown
# away after every run: CI-b7f3Qm9xKd2LpR4v. The other two cannot log in.
#
# The action versions are pinned to a full commit; the version is in the comment.

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# A push to a branch with an open pull request starts two runs (one for the push,
# one for the pull request). Both are put in one group named after the branch,
# and a newer run cancels the one in progress, so the tests do not run twice over.
# A run on main is never cancelled.
concurrency:
  group: tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ (github.head_ref || github.ref_name) != 'main' }}

jobs:
  unit:
    name: Unit tests (no database)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            Django/requirements.txt
            Django/requirements-dev.txt
      - name: Install GDAL (GeoDjango loads it)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gdal-bin libgdal-dev
      - name: Install
        run: pip install -r Django/requirements.txt -r Django/requirements-dev.txt
      - name: Django unit tests
        run: ETL/ci/steps.sh unit

  database:
    name: Database tests (seed, dbt, site tests, replay checks)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      db:
        # The image the project's docker-compose.yml uses.
        image: imresamu/postgis:18-3.6
        env:
          POSTGRES_USER: cascadia
          POSTGRES_PASSWORD: cascadia
          POSTGRES_DB: cascadia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cascadia -d cascadia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: cascadia
      PGPASSWORD: cascadia
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            Django/requirements.txt
            Django/requirements-dev.txt
            ETL/requirements.txt
      - name: Install GDAL (GeoDjango loads it) and the PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gdal-bin libgdal-dev postgresql-client
      - name: Install the Python requirements
        run: pip install -r Django/requirements.txt -r Django/requirements-dev.txt -r ETL/requirements.txt
      - name: Set up (the name db, /verify)
        run: ETL/ci/steps.sh prepare
      - name: Load the seed database
        run: ETL/ci/steps.sh load
      - name: Build with dbt, run its tests, build again and compare
        run: ETL/ci/steps.sh build
      - name: The real track files give the stored lines
        run: ETL/ci/steps.sh trackfiles
      - name: Site tests (TESTS/)
        run: ETL/ci/steps.sh site
      - name: Applied entries are not replayed
        run: ETL/ci/steps.sh replay
      - name: Website edits survive a rebuild
        run: ETL/ci/steps.sh edits
      - name: Keep the logs when something failed
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: logs
          path: ETL/verify/reports/
          retention-days: 7
