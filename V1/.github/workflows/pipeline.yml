name: Pipeline

# Every day around 2:00 AM Pacific (and when someone starts it by hand), this
# copies DB167 into the website's database, builds the new data beside the live
# copy, tests it, publishes it to the website when every test passed, and puts
# the report of the run online (Cloudflare Pages). The report is put online even
# when the run failed, with a red banner saying so.
#
# Publishing: the new data is built beside the live copy. Publishing is the
# quick final step that makes the new copy the live one. It is done only when
# every test passed, and only when it is turned on: a run started by hand has
# the Publish box below (off unless ticked), and a scheduled run publishes only
# when the repository variable PIPELINE_PUBLISH is true. Until the first
# cutover (the README's Pipeline Report section) it is not, so every run builds
# and tests and reports, and the website is not touched.
#
# The steps themselves are in ops/pipeline-steps.sh, which ops/pipeline-local.sh
# runs against a local database as well.
on:
  schedule:
    # GitHub's schedule is in UTC. 2:00 AM Pacific is 09:00 UTC in summer and
    # 10:00 UTC in winter, so both are listed and the first job lets through
    # only the one that falls in the 2 AM hour in Los Angeles. Minute 17, not
    # the top of the hour, because GitHub delays the busiest minutes by an hour
    # or more.
    - cron: "17 9 * * *"
    - cron: "17 10 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish The New Data To The Website: when off, the pipeline builds and tests the new data but leaves the website on the current data"
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  when:
    name: Is It 2:00 AM In Los Angeles
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      go: ${{ steps.when.outputs.go }}
    steps:
      - id: when
        run: |
          set -euo pipefail
          hour=$(TZ=America/Los_Angeles date +%H)
          if [ "${GITHUB_EVENT_NAME}" != schedule ] || [ "$hour" = 02 ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "It is ${hour}:xx in Los Angeles, not 02:xx, so this scheduled run does nothing. The other one will run."
          fi

  pipeline:
    name: Run The Pipeline
    needs: when
    if: needs.when.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    # Shared with deploy.yml: a pipeline run and a deploy of the website never
    # overlap. A second run waits its turn rather than cancelling the first.
    # Only this job holds the group, so the other schedule's no-op above cannot
    # push a waiting deploy out of the queue.
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      # By hand: the box. Scheduled: only when the variable PIPELINE_PUBLISH is true.
      PUBLISH: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.publish) || (vars.PIPELINE_PUBLISH == 'true' && 'true' || 'false') }}
      PIPELINE_TUNNEL_PORT: "15432"
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '143.198.155.64' }}
    steps:
      - name: Get The Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ETL/requirements.txt

      - name: Start The Run
        run: ops/pipeline-steps.sh begin

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install The SQL Server Driver
        run: |
          set -euo pipefail
          if ! odbcinst -q -d 2>/dev/null | grep -q "ODBC Driver 18"; then
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
              | sudo gpg --dearmor --yes -o /usr/share/keyrings/microsoft-prod.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/$(lsb_release -rs)/prod $(lsb_release -cs) main" \
              | sudo tee /etc/apt/sources.list.d/mssql-release.list >/dev/null
            sudo apt-get update -q
            sudo ACCEPT_EULA=Y apt-get install -y -q msodbcsql18 unixodbc
          fi
          odbcinst -q -d

      - name: Install Python Packages
        run: |
          set -euo pipefail
          pip install -q -r ETL/requirements.txt
          ops/pipeline-steps.sh deps

      - name: Open The Tunnel To The Database
        run: ops/pipeline-steps.sh tunnel-open
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          PIPELINE_DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}

      - name: Check The Database Connection
        run: ops/pipeline-steps.sh check
        env:
          PIPELINE_DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}

      - name: Set Up Elementary's Tables
        run: ops/pipeline-steps.sh elementary-models
        env:
          PIPELINE_DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}

      - name: Copy DB167 Into The Database
        run: ops/pipeline-steps.sh import
        env:
          PIPELINE_DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
          DB167_ODBC: ${{ secrets.DB167_ODBC }}

      - name: Is This The First Run Of The New Pipeline
        run: ops/pipeline-steps.sh detect
        env:
          PIPELINE_DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}

      - name: First Time Only, Move The Database Onto The New Pipeline
        run: ops/pipeline-steps.sh cutover
        env:
          PIPELINE_DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}

      - name: Build And Test The New Data
        run: ops/pipeline-steps.sh build
        env:
          PIPELINE_DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}

      - name: Publish The New Data To The Website
        run: ops/pipeline-steps.sh publish
        env:
          PIPELINE_DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}

      # From here on the steps run even when an earlier one failed, so the
      # report always goes online and says what happened.
      - name: Write The Pipeline Documentation
        if: always()
        continue-on-error: true
        run: ops/pipeline-steps.sh docs
        env:
          PIPELINE_DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}

      - name: Write The Elementary Report
        if: always()
        continue-on-error: true
        run: ops/pipeline-steps.sh elementary-report
        env:
          PIPELINE_DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}

      - name: Record This Run
        if: always()
        continue-on-error: true
        run: ops/pipeline-steps.sh record
        env:
          PIPELINE_DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
          JOB_STATUS: ${{ job.status }}

      - name: Make The Report's Web Site
        if: always()
        run: ops/pipeline-steps.sh site
        env:
          PIPELINE_DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
          JOB_STATUS: ${{ job.status }}

      - name: Put The Report Online
        if: always()
        run: ops/pipeline-steps.sh upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Record The Report's Address
        if: always()
        continue-on-error: true
        run: ops/pipeline-steps.sh report-address
        env:
          PIPELINE_DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}

      - name: Close The Tunnel And Remove The Key
        if: always()
        run: ops/pipeline-steps.sh tunnel-close
