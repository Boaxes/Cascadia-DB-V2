[project]
name = "unified-db"
version = "0.1.0"
description = "Unified DB: Cascadia Research Collective survey records and photo-ID catalogs"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=6.1,<6.2",
    "django-environ>=0.12",
    "django-htmx>=1.29",
    "duckdb>=2.0,<2.1",
    "gunicorn>=23",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=6.1,<6.2",
    "djlint>=1.36",
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-django>=4.10",
    "pytest-playwright>=0.7",
    "ruff>=0.11",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["V1", "Data", "scratch", "mockups", "local", ".claude", ".githooks", "*/migrations/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RET", "DJ", "S", "BLE", "T20", "C90", "PLR0912", "PLR0913", "PLR0915"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
"tests/**" = ["S101"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 12
max-statements = 50

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
check_untyped_defs = true
warn_return_any = true
exclude = ["^V1/", "^Data/", "^scratch/", "^mockups/", "^local/", "^\\.claude/", "^\\.githooks/", "/migrations/"]

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["core", "survey", "photoid", "data", "manage", "tests"]
markers = ["spec(*ids): the spec requirement IDs this test proves"]
addopts = "--strict-markers"

[tool.coverage.run]
branch = true
source = ["config", "core", "survey", "photoid", "data", "manage"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
fail_under = 85

[tool.djlint]
profile = "django"
indent = 2
extend_exclude = "V1,Data,scratch,mockups,local,.claude,.githooks"
