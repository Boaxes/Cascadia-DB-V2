<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings | Cascadia DB</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="settings">
<div class="app">
<script src="sidebar.js"></script>
<div class="main">
  <div class="page" style="max-width:760px">
    <div class="page-head">
      <div><h1>Settings</h1><p class="muted">Display settings are saved in this browser.</p></div>
    </div>
    <div class="notice green">Settings saved.</div>

    <section class="card">
      <h2>Colour Profile</h2>
      <label class="check"><input type="radio" name="profile" checked> Cascadia <span class="muted small">(a colour per species)</span></label>
      <label class="check"><input type="radio" name="profile"> Generic <span class="muted small">(a colour per species group)</span></label>
    </section>

    <section class="card">
      <h2>Track Display Defaults</h2>
      <p class="small muted">Each map can change these for its own view without changing the defaults.</p>
      <label class="check"><input type="checkbox"> Show Points</label>
      <label class="check"><input type="checkbox"> Show Timeline Events</label>
      <label class="check"><input type="checkbox"> Show Direction Arrows</label>
      <label class="check"><input type="checkbox" checked> Show Path When There Is No Track</label>

      <h3 style="margin-top:14px">Gaps</h3>
      <p class="small muted">A gap is any step between two GPS fixes that breaks a rule you have turned on.</p>
      <div class="form-grid">
        <label class="field" id="minutes-field"><span>Gap After Minutes of Silence</span>
          <input type="number" value="30" min="1" max="240"><span class="small muted">1–240</span></label>
        <div></div>
        <div>
          <label class="check"><input type="checkbox"> Gap After a Jump of Metres</label>
          <label class="field"><input type="number" value="1000" min="50" max="50000" disabled><span class="small muted">50–50,000</span></label>
        </div>
        <div>
          <label class="check"><input type="checkbox"> Gap Above a Speed of Knots</label>
          <label class="field"><input type="number" value="40" min="5" max="100" disabled><span class="small muted">5–100</span></label>
        </div>
      </div>
      <label class="field" style="max-width:240px"><span>Gap Style</span>
        <select><option>Dashed Line</option><option>Faint Line</option><option>Nothing</option></select></label>
      <button class="btn btn-primary" type="button">Save</button>
    </section>

    <section class="card">
      <h2>Change Password</h2>
      <div style="max-width:320px">
        <label class="field"><span>Current Password</span><input type="password"></label>
        <label class="field"><span>New Password</span><input type="password"></label>
        <label class="field"><span>Confirm New Password</span><input type="password"></label>
        <button class="btn btn-primary" type="button">Change Password</button>
      </div>
    </section>
  </div>
</div>
</div>
<script>
  // Mockup only: ?error=1 shows a field error (SET-05, ERR-05).
  if (new URLSearchParams(location.search).has("error")) {
    var field = document.getElementById("minutes-field");
    field.classList.add("field-error");
    field.querySelector("input").value = "0";
    field.insertAdjacentHTML("beforeend", '<div class="reason">Enter a number from 1 to 240.</div>');
    document.querySelector(".notice.green").remove();
  }
</script>
</body>
</html>
