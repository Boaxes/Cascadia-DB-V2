<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" preserveAspectRatio="xMidYMid slice">
  <!-- Static picture standing in for the Explore map (satellite basemap). Invented data. -->
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d2a38"/><stop offset="1" stop-color="#123747"/></linearGradient>
  </defs>
  <rect width="900" height="700" fill="url(#sea)"/>
  <!-- Land: Vancouver Island, Olympic Peninsula, Washington and Oregon coast -->
  <path d="M420 0 L900 0 L900 700 L560 700 L548 640 L560 560 L552 500 L566 440 L560 380 L578 330 L560 300 L590 268 L620 250 L640 210 L612 196 L600 170 L640 150 L660 120 L700 110 L720 70 L690 40 L640 60 L600 90 L560 100 L520 80 L480 60 L440 30 Z" fill="#2c3a2a"/>
