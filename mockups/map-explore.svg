    <path d="M560 172 C590 185 610 160 640 168"/>
    <path d="M552 330 C520 350 500 380 515 420 C525 445 540 460 548 480"/>
    <path d="M548 520 C520 540 505 575 520 610"/>
    <path d="M470 160 C430 190 400 230 420 270"/>
    <path d="M440 300 C415 330 410 360 430 390"/>
  </g>
  <g fill="none" stroke="#ffeb3b" stroke-width="1.4" stroke-dasharray="5 6" opacity=".7">
    <path d="M548 480 L548 520"/><path d="M420 270 L440 300"/>
  </g>
  <!-- Sightings: species colours -->
  <g stroke="#fff" stroke-width="1">
    <circle cx="645" cy="180" r="6" fill="#1f77b4"/><circle cx="700" cy="172" r="5" fill="#d62728"/><circle cx="712" cy="196" r="7" fill="#1f77b4"/>
    <circle cx="600" cy="172" r="4" fill="#2ca02c"/><circle cx="525" cy="395" r="8" fill="#1f77b4"/><circle cx="516" cy="440" r="5" fill="#9467bd"/>
    <circle cx="430" cy="210" r="6" fill="#ff7f0e"/><circle cx="415" cy="245" r="4" fill="#1f77b4"/><circle cx="520" cy="590" r="5" fill="#8c564b"/>
    <circle cx="430" cy="360" r="5" fill="#d62728"/><circle cx="505" cy="362" r="4" fill="#2ca02c"/><circle cx="690" cy="225" r="5" fill="#17becf"/>
