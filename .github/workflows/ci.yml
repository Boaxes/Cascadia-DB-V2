# Checks every push and pull request in the Docker stack (docker-compose.yml). Never deploys.
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build the web image
        run: docker compose build web
      - name: Start PostGIS
        run: docker compose up -d --wait db
      - name: Format
        run: docker compose run --rm --no-deps web ruff format --check .
      - name: Lint
        run: docker compose run --rm --no-deps web ruff check .
      - name: Templates
        run: |
          docker compose run --rm --no-deps web djlint . --check
          docker compose run --rm --no-deps web djlint . --lint
      - name: Django deploy checks
        run: >
          docker compose run --rm --no-deps
          -e DJANGO_DEBUG=false -e DJANGO_SECURE=true
          -e DJANGO_SECRET_KEY=ci-deploy-check-${{ github.run_id }}-not-used-anywhere-long-enough-for-the-check
          web python manage.py check --deploy --fail-level WARNING
      - name: Migrations are complete
        run: docker compose run --rm web python manage.py makemigrations --check --dry-run
      - name: Migrate
        run: docker compose run --rm web python manage.py migrate --noinput
      - name: Tests
        run: docker compose run --rm web pytest
