{# Sign In (AUTH-01): logo, site name, username and password, and no sidebar. #}
{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign In | Unified DB</title>
    <link rel="stylesheet" href="{% static 'core/style.css' %}">
  </head>
  <body>
    <div class="center-page">
      <form class="card login" method="post">
        {% csrf_token %}
        <img src="{% static 'core/cascadia-logo.png' %}" alt="">
        <h1>Unified DB</h1>
        <p class="muted">Marine mammal survey records and photo-ID catalogs.</p>
        {% if form.errors %}<div class="notice red">That username and password do not match an account.</div>{% endif %}
        <label class="field">
          <span>Username</span>
          <input type="text" name="username" autocomplete="username" required>
        </label>
        <label class="field">
          <span>Password</span>
          <input type="password"
                 name="password"
                 autocomplete="current-password"
                 required>
        </label>
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn btn-primary btn-block" type="submit">Sign In</button>
      </form>
    </div>
  </body>
</html>
